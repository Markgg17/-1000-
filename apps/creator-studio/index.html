<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎬 Creator Studio | MARKGG NEXUS</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172e50,#080d1c 60%);color:#e9f5ff;font:15px/1.5 system-ui,Segoe UI,sans-serif}header{padding:15px 22px;border-bottom:1px solid #ffffff26;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header a{color:#79edff;text-decoration:none}h1{font-size:clamp(25px,4vw,39px);margin:0}main{max-width:1200px;margin:auto;padding:24px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ffffff35;background:#233856;color:white;border-radius:10px;padding:10px 14px}button:hover{filter:brightness(1.2)}button.primary{background:linear-gradient(110deg,#65eaff,#a48aff);color:#071321;font-weight:800;border:0}input,select,textarea{background:#0e1c30;color:white;border:1px solid #526d8b;border-radius:10px;padding:9px}input[type=range]{padding:0;accent-color:#5de9ef}label{display:block;color:#b9d3eb;font-size:13px;margin:12px 0 5px}.panel{background:#121f35;border:1px solid #ffffff25;border-radius:19px;padding:21px}.layout{display:grid;grid-template-columns:290px 1fr;gap:18px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.muted{color:#a5bad2}.grid{display:grid;gap:12px}canvas{display:block;max-width:100%;touch-action:none}.hidden{display:none!important}@media(max-width:750px){.layout{grid-template-columns:1fr}} </style></head><body><header><a href="../../index.html">← MARKGG NEXUS</a><h1>🎬 Creator Studio</h1></header><main><div class="layout"><aside class="panel"><h2>Новый ролик</h2><form id="form"><label>Название</label><input id="title" required maxlength="120" style="width:100%" placeholder="Например: Forsaken с другом"><label>Платформа</label><select id="platform" style="width:100%"><option>VK Видео</option><option>Rutube</option><option>YouTube</option></select><label>Дата</label><input type="date" id="date" style="width:100%"><label>Идея и план</label><textarea id="notes" maxlength="1000" rows="5" style="width:100%"></textarea><button type="submit" class="primary" style="margin-top:14px;width:100%">+ Добавить ролик</button></form><hr style="border-color:#ffffff20;margin:20px 0"><div class="row"><button id="export">⬇ Экспорт JSON</button><button id="import">⬆ Импорт</button></div><input id="file" type="file" accept=".json,application/json" hidden><p class="muted">Все идеи хранятся в этом браузере. Для переноса на другой ПК экспортируй JSON.</p></aside><section class="panel"><div class="row" style="justify-content:space-between"><h2>Мои видео <span id="count">0</span></h2><input id="search" placeholder="Поиск..."><select id="filter"><option value="all">Все</option><option value="idea">Идея</option><option value="record">Съёмка</option><option value="edit">Монтаж</option><option value="done">Готово</option></select></div><div id="items" class="grid"></div></section></div></main><script>
const $=id=>document.getElementById(id),stages=['idea','record','edit','done'],names={idea:'💡 Идея',record:'🔴 Съёмка',edit:'🎞️ Монтаж',done:'✅ Готово'};let items=[];try{const x=JSON.parse(localStorage.getItem('nexus-videos')||'[]');if(Array.isArray(x))items=x.filter(v=>v&&typeof v.title==='string'&&stages.includes(v.stage)).slice(0,500)}catch{}function save(){try{localStorage.setItem('nexus-videos',JSON.stringify(items))}catch{alert('Хранилище заполнено. Экспортируй JSON.')}render()}
function render(){const host=$('items');host.replaceChildren();$('count').textContent=items.length;const term=$('search').value.toLowerCase(),filter=$('filter').value;for(const v of items.filter(v=>(filter==='all'||v.stage===filter)&&(v.title+' '+v.notes).toLowerCase().includes(term)).reverse()){const card=document.createElement('div');card.className='panel';const h=document.createElement('h3');h.textContent=v.title;const meta=document.createElement('p');meta.className='muted';meta.textContent=(v.platform||'VK Видео')+' · '+names[v.stage]+(v.date?' · '+v.date:'');const p=document.createElement('p');p.textContent=v.notes||'';const row=document.createElement('div');row.className='row';if(v.stage!=='done'){const b=document.createElement('button');b.textContent='Следующий этап →';b.className='primary';b.onclick=()=>{v.stage=stages[stages.indexOf(v.stage)+1];save()};row.append(b)}const del=document.createElement('button');del.textContent='Удалить';del.onclick=()=>{if(confirm('Удалить ролик?')){items=items.filter(x=>x.id!==v.id);save()}};row.append(del);card.append(h,meta,p,row);host.append(card)}if(!host.children.length){const p=document.createElement('p');p.textContent='Пока нет роликов. Добавь идею слева.';host.append(p)}}
$('form').onsubmit=e=>{e.preventDefault();items.push({id:Date.now()+'-'+Math.random(),title:$('title').value.trim(),platform:$('platform').value,date:$('date').value,notes:$('notes').value,stage:'idea'});$('form').reset();save()};$('search').oninput=render;$('filter').onchange=render;
$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='MARKGG-creator-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1000000){alert('Слишком большой файл');return}try{const v=JSON.parse(await f.text());if(!Array.isArray(v))throw Error();const clean=v.filter(x=>x&&typeof x.title==='string'&&x.title.length<=120&&stages.includes(x.stage)).slice(0,500).map(x=>({id:String(x.id||Math.random()),title:x.title,platform:String(x.platform||'VK Видео').slice(0,50),date:String(x.date||'').slice(0,20),notes:String(x.notes||'').slice(0,1000),stage:x.stage}));if(confirm('Заменить текущие данные на '+clean.length+' записей?')){items=clean;save()}}catch{alert('Неверный JSON')}e.target.value=''};render();
</script></body></html>
