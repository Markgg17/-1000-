<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚡ Neon Arena | MARKGG NEXUS</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172e50,#080d1c 60%);color:#e9f5ff;font:15px/1.5 system-ui,Segoe UI,sans-serif}header{padding:15px 22px;border-bottom:1px solid #ffffff26;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header a{color:#79edff;text-decoration:none}h1{font-size:clamp(25px,4vw,39px);margin:0}main{max-width:1200px;margin:auto;padding:24px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ffffff35;background:#233856;color:white;border-radius:10px;padding:10px 14px}button:hover{filter:brightness(1.2)}button.primary{background:linear-gradient(110deg,#65eaff,#a48aff);color:#071321;font-weight:800;border:0}input,select,textarea{background:#0e1c30;color:white;border:1px solid #526d8b;border-radius:10px;padding:9px}input[type=range]{padding:0;accent-color:#5de9ef}label{display:block;color:#b9d3eb;font-size:13px;margin:12px 0 5px}.panel{background:#121f35;border:1px solid #ffffff25;border-radius:19px;padding:21px}.layout{display:grid;grid-template-columns:290px 1fr;gap:18px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.muted{color:#a5bad2}.grid{display:grid;gap:12px}canvas{display:block;max-width:100%;touch-action:none}.hidden{display:none!important}@media(max-width:750px){.layout{grid-template-columns:1fr}} </style></head><body><header><a href="../../index.html">← MARKGG NEXUS</a><h1>⚡ Neon Arena</h1></header><main><div class="row"><b>Очки: <span id="score">0</span></b><b>❤️ <span id="hp">100</span></b><b>Волна: <span id="wave">1</span></b><b>Рекорд: <span id="best">0</span></b><button id="start" class="primary">Начать / заново</button><button id="pause">Пауза</button></div><p class="muted">WASD / стрелки — движение, ПРОБЕЛ — огонь, E — импульс. На телефоне используй кнопки ниже.</p><canvas id="c" style="width:100%;height:440px;background:#050b1b;border:1px solid #4a7095;border-radius:15px"></canvas><div class="row" style="margin-top:12px"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button><button id="shoot">ОГОНЬ</button><button id="pulse">ИМПУЛЬС</button></div><p id="status" aria-live="polite">Нажми «Начать».</p></main><script>
const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d'),keys=new Set();let player,foes=[],bullets=[],particles=[],score=0,time=0,spawn=0,shot=0,last=0,shield=-99,active=false,paused=false,fireTouch=false,inv=0,best=0;try{best=+(localStorage.getItem('nexus-best')||0)}catch{}$('best').textContent=best;
function size(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
function reset(){const r=c.getBoundingClientRect();player={x:r.width/2,y:r.height/2,hp:100};foes=[];bullets=[];particles=[];score=0;time=0;spawn=0;shot=0;shield=-99;inv=0;active=true;paused=false;$('status').textContent='Защищайся от врагов!'}
$('start').onclick=reset;$('pause').onclick=()=>{if(active){paused=!paused;$('status').textContent=paused?'Пауза':'Продолжай!'}};addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(k==='e')pulse()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();fireTouch=false;paused=true});
for(const b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{e.preventDefault();keys.add(b.dataset.key);b.setPointerCapture(e.pointerId)};for(const k of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(k,()=>keys.delete(b.dataset.key))}
$('shoot').onpointerdown=e=>{e.preventDefault();fireTouch=true;$('shoot').setPointerCapture(e.pointerId)};for(const k of ['pointerup','pointercancel','lostpointercapture'])$('shoot').addEventListener(k,()=>fireTouch=false);$('pulse').onclick=pulse;
function spark(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*140;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4,col})}}
function pulse(){if(!active||paused||time-shield<10)return;shield=time;foes=foes.filter(e=>{if(Math.hypot(e.x-player.x,e.y-player.y)<125){score+=10;spark(e.x,e.y,'#f5a',9);return false}return true});spark(player.x,player.y,'#7ef',24)}
function update(dt){const w=c.getBoundingClientRect().width,h=c.getBoundingClientRect().height;time+=dt;spawn-=dt;shot-=dt;inv=Math.max(0,inv-dt);if(spawn<=0){const side=Math.floor(Math.random()*4);foes.push({x:side===0?0:side===1?w:Math.random()*w,y:side===2?0:side===3?h:Math.random()*h,r:10+Math.random()*9,s:65+time*1.4});spawn=Math.max(.27,.9-time*.01)}
let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0),len=Math.hypot(dx,dy)||1;player.x=Math.max(14,Math.min(w-14,player.x+dx/len*245*dt));player.y=Math.max(14,Math.min(h-14,player.y+dy/len*245*dt));
if((keys.has(' ')||fireTouch)&&shot<=0&&foes.length){let t=foes.reduce((a,b)=>Math.hypot(b.x-player.x,b.y-player.y)<Math.hypot(a.x-player.x,a.y-player.y)?b:a);let a=Math.atan2(t.y-player.y,t.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*560,vy:Math.sin(a)*560,life:.9});shot=.14}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}
for(const e of foes){const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.s*dt;e.y+=Math.sin(a)*e.s*dt;if(inv===0&&Math.hypot(e.x-player.x,e.y-player.y)<e.r+13){player.hp-=20;inv=1;e.dead=true;spark(player.x,player.y,'#f56',18)}for(const b of bullets)if(b.life>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){e.dead=true;b.life=0;score+=10;spark(e.x,e.y,'#f5a',10);break}}
foes=foes.filter(e=>!e.dead);bullets=bullets.filter(b=>b.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
if(player.hp<=0){active=false;$('status').textContent='Игра окончена. Нажми «Начать / заново».';if(score>best){best=score;try{localStorage.setItem('nexus-best',best)}catch{}}}$('score').textContent=score;$('hp').textContent=Math.max(0,player.hp);$('wave').textContent=1+Math.floor(time/18);$('best').textContent=best}
function draw(){const w=c.getBoundingClientRect().width,h=c.getBoundingClientRect().height;ctx.fillStyle='#050b1b';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#243e6544';for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}function ball(x,y,r,color){ctx.shadowColor=color;ctx.shadowBlur=17;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
for(const e of foes)ball(e.x,e.y,e.r,'#ff5ca5');for(const b of bullets)ball(b.x,b.y,4,'#73efff');for(const p of particles)ball(p.x,p.y,2,p.col);if(player){ctx.globalAlpha=inv>0?.55:1;ball(player.x,player.y,13,'#66eeff');ctx.globalAlpha=1}if(paused){ctx.fillStyle='#02071799';ctx.fillRect(0,0,w,h);ctx.fillStyle='white';ctx.font='bold 30px system-ui';ctx.fillText('ПАУЗА',w/2-65,h/2)}}
function loop(t){const dt=Math.min((t-last)/1000||0,.035);last=t;if(active&&!paused)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
