<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c1a"><title>MARK CODE LAB — NEXUS</title><style>
*{box-sizing:border-box}body{margin:0;background:#080c19;color:#eaf7ff;font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif}
header{padding:13px 24px;background:#101a2e;border-bottom:1px solid #2d4663;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}a{color:#8ceeff;text-decoration:none}h1{font-size:22px;margin:0;letter-spacing:-.5px}h1 span{color:#7defff}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{border:1px solid #52718c;background:#1b3250;color:#f2f7ff;font:inherit;font-weight:800;border-radius:10px;padding:10px 14px;cursor:pointer}button.primary{background:linear-gradient(110deg,#57e9f4,#ad88ff);border:0;color:#071327}button:hover{filter:brightness(1.15)}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid #72efff;outline-offset:2px}
main{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 69px);min-height:470px}.editors{display:grid;grid-template-rows:repeat(3,minmax(110px,1fr));min-height:0;border-right:1px solid #425571}
.editor{min-height:0;display:flex;flex-direction:column;border-bottom:1px solid #30445f}.editor label{padding:8px 15px;background:#111d32;color:#b5c9e0;font-size:12px;font-weight:900;letter-spacing:1px}.editor textarea{font:13px/1.48 Consolas,'Courier New',monospace;color:#ceeafc;background:#090f1f;resize:none;width:100%;flex:1;border:none;outline:none;padding:15px;tab-size:2}.preview{display:flex;flex-direction:column;min-width:0;background:#e7eaf4}.preview-bar{padding:9px 14px;background:#192944;color:#b4d1eb;display:flex;justify-content:space-between;gap:8px}.preview iframe{background:white;width:100%;height:100%;border:0;min-height:0}.status{font-size:12px;color:#88ebbe}
@media(max-width:760px){main{grid-template-columns:1fr;height:auto}.editors{height:640px;border-right:none}.preview{height:460px}.toolbar{width:100%}header{gap:8px}}
</style></head><body><header><a href="../../index.html">← NEXUS</a><h1>⌘ MARK <span>CODE LAB</span></h1><div class="toolbar"><span id="status" class="status">Готово</span><button id="example">Пример</button><button id="clear">Очистить</button><button id="export">⬇ HTML</button><button id="run" class="primary">▶ Запустить</button></div></header>
<main><section class="editors" aria-label="Редактор кода"><div class="editor"><label for="html">HTML</label><textarea id="html" spellcheck="false" aria-label="HTML код"></textarea></div><div class="editor"><label for="css">CSS</label><textarea id="css" spellcheck="false" aria-label="CSS код"></textarea></div><div class="editor"><label for="js">JAVASCRIPT</label><textarea id="js" spellcheck="false" aria-label="JavaScript код"></textarea></div></section><section class="preview"><div class="preview-bar"><strong>◉ ЖИВОЙ ПРЕДПРОСМОТР</strong><span>Изолированная песочница</span></div><iframe id="frame" title="Предпросмотр вашего сайта" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></section></main>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),key="markgg-code-lab-v1";
const demo={html:'<main class="card"><div class="orb">✦</div><h1>Привет, MARKGG!</h1><p>Мой первый сайт в CODE LAB 🚀</p><button onclick="add()">Нажми на меня</button><p id="msg"></p></main>',css:'*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#2b4078,#080d20);color:#fff;font:16px system-ui;display:grid;place-items:center}.card{text-align:center;padding:36px;border:1px solid #6eeaff66;border-radius:24px;background:#121a32;box-shadow:0 30px 70px #0008}.orb{font-size:72px;color:#7feaff;text-shadow:0 0 30px #47cfff}h1{font-size:36px}p{color:#abc1dc}button{padding:12px 22px;border:0;border-radius:13px;background:#7aeaff;font-weight:900;cursor:pointer}',js:'let count=0;function add(){document.getElementById("msg").textContent="Нажатий: "+(++count)+" ⚡";}'};
function set(v){for(const id of ["html","css","js"])$(id).value=v[id]||""}let saved=null;try{saved=JSON.parse(localStorage.getItem(key)||"null")}catch{}set(saved&&typeof saved.html==="string"?saved:demo);
function bundle(){const html=$("html").value,css=$("css").value.replace(/<\/style/gi,"<\\/style"),js=$("js").value.replace(/<\/script/gi,"<\\/script");const open="<scr"+"ipt>",close="</scr"+"ipt>";return '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+css+'</style></head><body>'+html+open+js+close+'</body></html>'}
function run(){const csp="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'";$("frame").srcdoc='<!doctype html><meta http-equiv="Content-Security-Policy" content="'+csp+'">'+bundle();$("status").textContent="Предпросмотр обновлён"}
let timer;for(const id of ["html","css","js"])$(id).addEventListener("input",()=>{try{localStorage.setItem(key,JSON.stringify({html:$("html").value,css:$("css").value,js:$("js").value}))}catch{}$("status").textContent="Изменения сохранены";clearTimeout(timer);timer=setTimeout(run,450)});
$("run").onclick=run;$("example").onclick=()=>{if(confirm("Заменить текущий код примером?")){set(demo);try{localStorage.setItem(key,JSON.stringify(demo))}catch{}run()}};
$("clear").onclick=()=>{if(confirm("Очистить весь код?")){set({});try{localStorage.removeItem(key)}catch{}run()}};
$("export").onclick=()=>{const u=URL.createObjectURL(new Blob([bundle()],{type:"text/html;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="MARKGG-my-site.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500)};
run()})();
</script></body></html>
