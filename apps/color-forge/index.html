<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c1a"><title>MARK COLOR FORGE — NEXUS</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a2b51,#080c19 65%);color:#eef8ff;font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif}header{padding:18px 24px;background:#101a2eaa;border-bottom:1px solid #ffffff20;display:flex;align-items:center;gap:18px}a{color:#8ceeff;text-decoration:none}h1{font-size:22px;margin:0}main{max-width:1100px;margin:30px auto;padding:0 18px}.layout{display:grid;grid-template-columns:305px 1fr;gap:20px}.panel{background:#14203a;border:1px solid #ffffff2c;border-radius:20px;padding:22px}.preview{height:380px;border-radius:20px;position:relative;overflow:hidden;box-shadow:0 15px 50px #0009}.preview:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff13 1px,transparent 1px),linear-gradient(90deg,#ffffff13 1px,transparent 1px);background-size:40px 40px;opacity:.3}.preview .mark{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;text-shadow:0 4px 30px #0009;font-weight:1000;font-size:clamp(28px,7vw,65px);letter-spacing:-3px}.mark small{display:block;font-size:13px;letter-spacing:3px;color:#ffffffd9}label{display:block;margin:13px 0 7px;color:#c5dcf3;font-size:13px;font-weight:800}.field{display:flex;gap:10px;align-items:center}.field input[type=color]{width:75px;height:48px;padding:2px;border:1px solid #576c88;border-radius:9px;background:#0f1a2b;cursor:pointer}.value{color:#abcae3;font-family:monospace}.range{width:100%;accent-color:#79eaff}button{border:1px solid #486482;background:#1c3352;color:#fff;font:inherit;font-weight:800;border-radius:11px;padding:11px 13px;cursor:pointer}button.primary{border:0;color:#071225;background:linear-gradient(110deg,#68eaff,#aa88ff)}button:hover{filter:brightness(1.15)}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.code{white-space:pre-wrap;word-break:break-all;background:#071222;border:1px solid #365075;border-radius:13px;padding:19px;color:#9de9ff;font:13px/1.7 Consolas,monospace}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:15px}.swatch{height:66px;border:2px solid #ffffff45;border-radius:10px;display:flex;justify-content:center;align-items:end;color:#fff;font:10px Consolas,monospace;text-shadow:0 1px 6px #000;background:#333;padding-bottom:5px;cursor:pointer}.muted{color:#a5bad5;font-size:13px}.status{color:#92eebf;min-height:20px}@media(max-width:760px){.layout{grid-template-columns:1fr}.preview{height:280px}.palette{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header><a href="../../index.html">← NEXUS</a><h1>🎨 MARK COLOR FORGE</h1></header><main><div class="layout"><aside class="panel"><h2>Твоя палитра</h2><label for="one">Первый цвет</label><div class="field"><input type="color" id="one" value="#20d9fa"><span class="value" id="oneV">#20d9fa</span></div><label for="two">Второй цвет</label><div class="field"><input type="color" id="two" value="#965cff"><span class="value" id="twoV">#965cff</span></div><label for="angle">Угол градиента <strong id="angleV">125°</strong></label><input class="range" id="angle" type="range" min="0" max="360" value="125"><label for="mode">Тип градиента</label><select id="mode" style="width:100%;background:#0c192d;color:white;padding:11px;border:1px solid #49617a;border-radius:10px"><option value="linear">Линейный</option><option value="radial">Радиальный</option></select><div class="row"><button class="primary" id="random">🎲 Случайно</button><button id="swap">⇄ Поменять</button></div><p class="muted">Используй градиенты в своих играх, сайтах и обложках.</p></aside><section><div id="preview" class="preview"><div class="mark"><div>MARKGG<br>NEON<small>CREATIVE COLOR STUDIO</small></div></div></div><div class="panel" style="margin-top:17px"><h3>Готовый CSS</h3><div id="css" class="code"></div><div class="row"><button id="copy" class="primary">📋 Скопировать CSS</button><button id="download">⬇ Скачать SVG</button></div><h3>Палитра из 5 цветов</h3><div class="palette" id="palette"></div><p id="status" class="status" aria-live="polite"></p></div></section></div></main>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id);
function blend(a,b,t){const n=v=>parseInt(v,16),c=x=>Math.round(x).toString(16).padStart(2,"0");return "#"+[1,3,5].map(i=>c(n(a.slice(i,i+2))*(1-t)+n(b.slice(i,i+2))*t)).join("")}
function css(){const a=$("one").value,b=$("two").value,angle=+$("angle").value;return $("mode").value==="linear"?"linear-gradient("+angle+"deg, "+a+", "+b+")":"radial-gradient(circle, "+a+", "+b+")"}
function render(){const value=css();$("preview").style.background=value;$("css").textContent="background: "+value+";";for(const id of ["one","two"])$(id+"V").textContent=$(id).value;$("angleV").textContent=$("angle").value+"°";const p=$("palette");p.replaceChildren();for(let i=0;i<5;i++){const v=blend($("one").value,$("two").value,i/4),s=document.createElement("button");s.type="button";s.className="swatch";s.style.background=v;s.textContent=v;s.title="Скопировать "+v;s.onclick=()=>copy(v);p.append(s)}}
function copy(v){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v).then(()=>$("status").textContent="Скопировано: "+v).catch(()=>$("status").textContent="Не удалось скопировать: "+v);else $("status").textContent="Выдели и скопируй: "+v}
for(const id of ["one","two","angle","mode"])$(id).addEventListener("input",render);
$("copy").onclick=()=>copy($("css").textContent);$("swap").onclick=()=>{const v=$("one").value;$("one").value=$("two").value;$("two").value=v;render()};
$("random").onclick=()=>{const random=()=>'#'+Math.floor(Math.random()*16777216).toString(16).padStart(6,"0");$("one").value=random();$("two").value=random();$("angle").value=Math.floor(Math.random()*361);render()};
$("download").onclick=()=>{const a=$("one").value,b=$("two").value,ang=+$("angle").value,rad=(ang-90)*Math.PI/180,x1=Math.round(50-50*Math.cos(rad)),y1=Math.round(50-50*Math.sin(rad)),x2=100-x1,y2=100-y1,mode=$("mode").value;const grad=mode==="linear"?'<linearGradient id="g" x1="'+x1+'%" y1="'+y1+'%" x2="'+x2+'%" y2="'+y2+'%"><stop stop-color="'+a+'"/><stop offset="100%" stop-color="'+b+'"/></linearGradient>':'<radialGradient id="g"><stop stop-color="'+a+'"/><stop offset="100%" stop-color="'+b+'"/></radialGradient>';const svg='<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs>'+grad+'</defs><rect width="1920" height="1080" fill="url(#g)"/></svg>';const u=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml;charset=utf-8"})),link=document.createElement("a");link.href=u;link.download="MARKGG-gradient.svg";link.click();setTimeout(()=>URL.revokeObjectURL(u),2500)};
render()})();
</script></body></html>
