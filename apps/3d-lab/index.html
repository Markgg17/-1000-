<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🧊 3D Print Lab | MARKGG NEXUS</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172e50,#080d1c 60%);color:#e9f5ff;font:15px/1.5 system-ui,Segoe UI,sans-serif}header{padding:15px 22px;border-bottom:1px solid #ffffff26;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header a{color:#79edff;text-decoration:none}h1{font-size:clamp(25px,4vw,39px);margin:0}main{max-width:1200px;margin:auto;padding:24px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ffffff35;background:#233856;color:white;border-radius:10px;padding:10px 14px}button:hover{filter:brightness(1.2)}button.primary{background:linear-gradient(110deg,#65eaff,#a48aff);color:#071321;font-weight:800;border:0}input,select,textarea{background:#0e1c30;color:white;border:1px solid #526d8b;border-radius:10px;padding:9px}input[type=range]{padding:0;accent-color:#5de9ef}label{display:block;color:#b9d3eb;font-size:13px;margin:12px 0 5px}.panel{background:#121f35;border:1px solid #ffffff25;border-radius:19px;padding:21px}.layout{display:grid;grid-template-columns:290px 1fr;gap:18px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.muted{color:#a5bad2}.grid{display:grid;gap:12px}canvas{display:block;max-width:100%;touch-action:none}.hidden{display:none!important}@media(max-width:750px){.layout{grid-template-columns:1fr}} </style></head><body><header><a href="../../index.html">← MARKGG NEXUS</a><h1>🧊 3D Print Lab</h1></header><main><div class="layout"><aside class="panel"><label>Фигура</label><select id="shape" style="width:100%"><option value="box">Прямоугольный блок</option><option value="cylinder">Цилиндр</option><option value="hex">Шестигранная колонна</option><option value="pyramid">Пирамида</option></select><label>Ширина / диаметр: <b id="wv">60 мм</b></label><input id="w" type="range" min="10" max="250" value="60" style="width:100%"><label>Глубина: <b id="dv">60 мм</b></label><input id="d" type="range" min="10" max="250" value="60" style="width:100%"><label>Высота: <b id="hv">30 мм</b></label><input id="h" type="range" min="5" max="200" value="30" style="width:100%"><p class="muted">Вращай модель мышкой или пальцем, масштабируй колёсиком.</p><button id="save" class="primary" style="width:100%">⬇ Скачать STL</button><p class="muted">Файл STL сохраняет размеры в миллиметрах. Проверь модель в слайсере перед печатью.</p></aside><section class="panel"><div class="row"><b>3D-ПРОСМОТР</b><span id="info" class="muted"></span></div><canvas id="c" style="width:100%;height:480px;background:#0a1529;border-radius:12px;cursor:grab"></canvas></section></div></main><script>
const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d');let faces=[],yaw=.6,pitch=.45,zoom=1,drag=null;function tri(a,b,d){faces.push([a,b,d])}function quad(a,b,d,e){tri(a,b,d);tri(a,d,e)}
function mesh(){faces=[];const w=+$('w').value,d=+$('d').value,h=+$('h').value,shape=$('shape').value,x=w/2,z=d/2;
if(shape==='box'){const p=[[-x,0,-z],[x,0,-z],[x,0,z],[-x,0,z],[-x,h,-z],[x,h,-z],[x,h,z],[-x,h,z]];for(const ids of [[0,3,2,1],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]])quad(...ids.map(i=>p[i]))}
else if(shape==='pyramid'){const p=[[-x,0,-z],[x,0,-z],[x,0,z],[-x,0,z]],top=[0,h,0];quad(p[0],p[3],p[2],p[1]);for(let i=0;i<4;i++)tri(p[i],p[(i+1)%4],top)}
else{const n=shape==='hex'?6:48,r=w/2;for(let i=0;i<n;i++){const a=i*2*Math.PI/n,b=(i+1)*2*Math.PI/n,p=[r*Math.cos(a),0,r*Math.sin(a)],q=[r*Math.cos(b),0,r*Math.sin(b)],P=[p[0],h,p[2]],Q=[q[0],h,q[2]];quad(p,q,Q,P);tri([0,h,0],P,Q);tri([0,0,0],q,p)}}
for(const id of ['w','d','h'])$(id+'v').textContent=$(id).value+' мм';$('info').textContent=faces.length+' треугольников';draw()}
function normal(f){const [a,b,c]=f,u=b.map((v,i)=>v-a[i]),v=c.map((q,i)=>q-a[i]),n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],l=Math.hypot(...n)||1;return n.map(x=>x/l)}
function rotate(p){const y=p[1]-(+$('h').value)/2,co=Math.cos(yaw),si=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p[0]*co+p[2]*si,z=-p[0]*si+p[2]*co;return [x,y*cp-z*sp,y*sp+z*cp]}
function draw(){const r=c.getBoundingClientRect(),w=r.width,h=r.height,dpr=Math.min(devicePixelRatio||1,2);if(!w||!h)return;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0a1529';ctx.fillRect(0,0,w,h);const scale=Math.min(w,h)*.6/Math.max(30,+$('w').value,+$('d').value,+$('h').value)*zoom;
const list=faces.map(f=>({points:f.map(p=>{const r=rotate(p);return [w/2+r[0]*scale,h/2-r[1]*scale,r[2]]}),z:f.reduce((s,p)=>s+rotate(p)[2],0)/3,n:normal(f)})).sort((a,b)=>b.z-a.z);
for(const t of list){const shade=Math.max(.2,.55+t.n[1]*.25+t.n[2]*.16);ctx.fillStyle='hsl(185 80% '+Math.round(25+shade*32)+'%)';ctx.strokeStyle='#a4f7ffb3';ctx.beginPath();ctx.moveTo(...t.points[0].slice(0,2));for(let i=1;i<3;i++)ctx.lineTo(...t.points[i].slice(0,2));ctx.closePath();ctx.fill();ctx.stroke()}}
c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.01;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-drag.y)*.01));drag={x:e.clientX,y:e.clientY};draw()};for(const k of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(k,()=>drag=null);c.onwheel=e=>{e.preventDefault();zoom=Math.max(.35,Math.min(3,zoom*(e.deltaY>0?.9:1.1)));draw()};
for(const id of ['shape','w','d','h'])$(id).oninput=mesh;new ResizeObserver(draw).observe(c);
$('save').onclick=()=>{const buf=new ArrayBuffer(84+faces.length*50),v=new DataView(buf);v.setUint32(80,faces.length,true);let o=84;for(const f of faces){for(const q of normal(f)){v.setFloat32(o,q,true);o+=4}for(const p of f)for(const q of p){v.setFloat32(o,q,true);o+=4}v.setUint16(o,0,true);o+=2}const url=URL.createObjectURL(new Blob([buf],{type:'model/stl'})),a=document.createElement('a');a.href=url;a.download='MARKGG-'+$('shape').value+'-'+$('w').value+'x'+$('d').value+'x'+$('h').value+'.stl';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};mesh();
</script></body></html>
