<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎨 Pixel Studio | MARKGG NEXUS</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172e50,#080d1c 60%);color:#e9f5ff;font:15px/1.5 system-ui,Segoe UI,sans-serif}header{padding:15px 22px;border-bottom:1px solid #ffffff26;display:flex;align-items:center;gap:20px;flex-wrap:wrap}header a{color:#79edff;text-decoration:none}h1{font-size:clamp(25px,4vw,39px);margin:0}main{max-width:1200px;margin:auto;padding:24px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ffffff35;background:#233856;color:white;border-radius:10px;padding:10px 14px}button:hover{filter:brightness(1.2)}button.primary{background:linear-gradient(110deg,#65eaff,#a48aff);color:#071321;font-weight:800;border:0}input,select,textarea{background:#0e1c30;color:white;border:1px solid #526d8b;border-radius:10px;padding:9px}input[type=range]{padding:0;accent-color:#5de9ef}label{display:block;color:#b9d3eb;font-size:13px;margin:12px 0 5px}.panel{background:#121f35;border:1px solid #ffffff25;border-radius:19px;padding:21px}.layout{display:grid;grid-template-columns:290px 1fr;gap:18px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.muted{color:#a5bad2}.grid{display:grid;gap:12px}canvas{display:block;max-width:100%;touch-action:none}.hidden{display:none!important}@media(max-width:750px){.layout{grid-template-columns:1fr}} </style></head><body><header><a href="../../index.html">← MARKGG NEXUS</a><h1>🎨 Pixel Studio</h1></header><main><div class="layout"><aside class="panel"><label>Цвет</label><input id="color" type="color" value="#63edff" style="width:100%;height:48px"><label>Размер сетки</label><select id="size" style="width:100%"><option value="16">16 × 16</option><option value="24">24 × 24</option><option value="32">32 × 32</option><option value="48">48 × 48</option></select><label>Инструмент</label><div class="row"><button data-tool="draw" class="primary">✏️ Кисть</button><button data-tool="erase">Ластик</button><button data-tool="fill">Заливка</button></div><label>История</label><div class="row"><button id="undo">↶ Отменить</button><button id="redo">↷ Вернуть</button></div><label>Экспорт</label><div class="row"><button id="save" class="primary">⬇ PNG</button><button id="clear">Очистить</button></div><p class="muted">Нажимай и води пальцем или мышкой по холсту. Изображение сохраняется в PNG с прозрачностью.</p></aside><div class="panel"><canvas id="art" style="width:min(100%,650px);aspect-ratio:1;background:#d4dbea;border:1px solid #70839d;border-radius:9px;image-rendering:pixelated;cursor:crosshair"></canvas><p id="info" class="muted"></p></div></div></main><script>
const $=id=>document.getElementById(id),c=$('art'),ctx=c.getContext('2d');let n=16,pixels=[],tool='draw',down=false,history=[],future=[];function reset(){n=+$('size').value;pixels=Array(n*n).fill(null);history=[];future=[];render()}function snapshot(){history.push(pixels.slice());if(history.length>60)history.shift();future=[]}function render(){const d=640/n;c.width=640;c.height=640;ctx.clearRect(0,0,640,640);for(let y=0;y<n;y++)for(let x=0;x<n;x++){const v=pixels[y*n+x];ctx.fillStyle=v||((x+y)%2?'#c4cdd9':'#e8edf4');ctx.fillRect(x*d,y*d,d+.2,d+.2)}$('info').textContent=n+' × '+n+' · '+history.length+' действий'}
function paint(e){const b=c.getBoundingClientRect(),x=Math.max(0,Math.min(n-1,Math.floor((e.clientX-b.left)/b.width*n))),y=Math.max(0,Math.min(n-1,Math.floor((e.clientY-b.top)/b.height*n))),i=y*n+x;if(tool==='fill'){const from=pixels[i],to=$('color').value;if(from===to)return;const todo=[i],seen=new Set();while(todo.length){const j=todo.pop();if(j<0||j>=pixels.length||seen.has(j)||pixels[j]!==from)continue;seen.add(j);pixels[j]=to;const a=j%n,b=Math.floor(j/n);if(a>0)todo.push(j-1);if(a<n-1)todo.push(j+1);if(b>0)todo.push(j-n);if(b<n-1)todo.push(j+n)}}else pixels[i]=tool==='erase'?null:$('color').value;render()}
c.onpointerdown=e=>{e.preventDefault();snapshot();down=true;c.setPointerCapture(e.pointerId);paint(e)};c.onpointermove=e=>{if(down&&tool!=='fill')paint(e)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(ev,()=>down=false);
for(const b of document.querySelectorAll('[data-tool]'))b.onclick=()=>{tool=b.dataset.tool;for(const x of document.querySelectorAll('[data-tool]'))x.classList.toggle('primary',x===b)};
$('undo').onclick=()=>{if(!history.length)return;future.push(pixels.slice());pixels=history.pop();render()};$('redo').onclick=()=>{if(!future.length)return;history.push(pixels.slice());pixels=future.pop();render()};$('size').onchange=()=>{if(confirm('Изменить размер? Текущий рисунок будет очищен.'))reset();else $('size').value=String(n)};$('clear').onclick=()=>{if(confirm('Очистить рисунок?')){snapshot();pixels.fill(null);render()}};
$('save').onclick=()=>{const out=document.createElement('canvas');out.width=out.height=n*16;const q=out.getContext('2d');pixels.forEach((v,i)=>{if(v){q.fillStyle=v;q.fillRect((i%n)*16,Math.floor(i/n)*16,16,16)}});out.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MARKGG-pixel-art.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};reset();
</script></body></html>
